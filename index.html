<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }
    </style>
</head>

<body>
    <img src="./polyester.gif" alt=""></img>
    <audio id="music" src="./polyester.wav"></audio>

    <script>
    const music = document.getElementById("music");

    music.addEventListener("ended", () => {
        music.currentTime = 0;
        music.play();
    });

    music.play();
    </script>
</body>
</html>
